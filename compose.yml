# Settings come from .env (copy .env.example) and config/apps.json (copy config/apps.example.json). Both stay out of git.
services:
  console:
    build: .
    image: hyphen-console:local
    container_name: hyphen-console
    restart: unless-stopped
    # Runs as the image's unprivileged "node" user unless .env says otherwise (see CONTAINER_USER in .env.example).
    # Either way it gets no Linux capabilities, a read-only filesystem and read-only mounts.
    user: ${CONTAINER_USER:-node}
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    ports:
      - "${BIND_IP:-0.0.0.0}:${PORT:-8095}:8080"
    environment:
      ALLOWED_CIDRS: ${ALLOWED_CIDRS:-}
      TZ: ${TZ:-UTC}
      CONSOLE_URL: ${CONSOLE_URL:-}
      CHECK_INTERVAL_SECONDS: ${CHECK_INTERVAL_SECONDS:-120}
      CHECK_FAIL_THRESHOLD: ${CHECK_FAIL_THRESHOLD:-2}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      REVIEW_SYNC_MINUTES: ${REVIEW_SYNC_MINUTES:-60}
      REVIEW_EMAILS: ${REVIEW_EMAILS:-all}
      APP_STORE_CONNECT_KEY_ID: ${APP_STORE_CONNECT_KEY_ID:-}
      APP_STORE_CONNECT_ISSUER_ID: ${APP_STORE_CONNECT_ISSUER_ID:-}
      APP_STORE_CONNECT_FINANCE_KEY_ID: ${APP_STORE_CONNECT_FINANCE_KEY_ID:-}
      VITALS_SYNC_HOURS: ${VITALS_SYNC_HOURS:-6}
      DIGEST: ${DIGEST:-on}
      DIGEST_DAY: ${DIGEST_DAY:-monday}
      DIGEST_HOUR: ${DIGEST_HOUR:-8}
    volumes:
      - ./config:/config:ro
      - ./secrets:/secrets:ro
      # Check history (SQLite). The only writable path in the container.
      - ./data:/data
      - ${BUILDS_ROOT:?set BUILDS_ROOT in .env}:/srv/builds:ro
